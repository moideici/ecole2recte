<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- La couleur de la barre du navigateur suit celle du bandeau, dans les deux thèmes. -->
    <meta name="theme-color" content="#154c9b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d2347" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <!--
      Aucune feuille de style ni police venue d'ailleurs : la politique de contenu posée dans
      `hooks.server.ts` n'autorise que `'self'`, et un `<link>` vers Google Fonts ne chargeait
      donc rien — tout en annonçant l'adresse de qui visite à un tiers. La pile de polices de
      `app.css` prend Montserrat si l'appareil l'a déjà, et celle du système sinon.
    -->
    <!--
      Le thème choisi, appliqué **avant** le premier pixel.
      Sans ce script, la préférence ne reprenait effet qu'en arrivant sur la page Réglages :
      partout ailleurs, un rechargement revenait au thème du système. Il est en ligne parce
      qu'un fichier séparé arriverait trop tard — l'écran aurait déjà clignoté.
    -->
    <script>
      try {
        var t = localStorage.getItem('e2r-theme')
        if (t === 'clair' || t === 'sombre') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        // Navigation privée, stockage refusé : le thème du système fera l'affaire.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
