name = "ecole2recte-web"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

# Écrasé à chaque build par @sveltejs/adapter-cloudflare : c'est lui qui écrit le worker ici.
main = ".svelte-kit/cloudflare/_worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Le Durable Object des sessions vit dans un worker séparé (apps/sessions) : l'adaptateur
# régénère ce fichier à chaque build et ne peut donc pas exporter notre propre classe. Le lien
# externe (`script_name`) évite ce problème sans y toucher.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDurableObject"
script_name = "ecole2recte-sessions"

[[routes]]
pattern = "ed.moideici.tech"
custom_domain = true

# Les mêmes réglages que .env.example, réglables sans reconstruire l'application — un
# `wrangler deploy` suffit. `SESSION_SECRET` n'est volontairement pas ici : c'est un secret,
# posé avec `wrangler secret put SESSION_SECRET`, jamais en clair dans ce fichier versionné.
[vars]
ED_API_VERSION = "4.101.4"
ED_TIMEZONE = "Europe/Paris"
ED_DEMO = "0"

# L'écriture, ouverte fonction par fonction.
#
# `cloud-delete` reste fermée : une suppression de fichier ne se défait pas, et aucune de ces
# fonctions n'a encore passé son aller-retour réel (`pnpm smoke`). Les quatre ouvertes ici se
# rattrapent — décocher un devoir, supprimer un dossier créé, renommer à nouveau — sauf le
# commentaire, qui part chez le professeur et que l'interface annonce comme tel avant l'envoi.
#
# Le déverrouillage est ici et **pas** dans `.env.example`, qui reste fermé : un fichier
# d'exemple qui ouvrirait l'écriture finirait un jour copié tel quel ailleurs.
ED_WRITE_POLICY = "allow"
ED_WRITE_FEATURES = "homework-done,homework-comment,cloud-folder,cloud-rename"
