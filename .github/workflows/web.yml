name: Client web

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Tests et typage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm -r test

      - name: Typage
        run: pnpm -r typecheck

      - name: Construction
        run: pnpm -r build

      # Le service n'est jamais appelé depuis la CI : ni compte, ni jeton, ni écriture.
      # Une capture réseau brute porterait le mot de passe en clair, d'où ce garde-fou.
      - name: Aucune capture réseau dans le dépôt
        run: |
          if git ls-files | grep -E '\.har$|^captures/'; then
            echo "Une capture réseau a été committée : elle porte le mot de passe en clair."
            exit 1
          fi
          echo "Aucune capture réseau versionnée."
